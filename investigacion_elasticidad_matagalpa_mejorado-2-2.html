<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- HASHING DE CONTRASEÑA (Web Crypto API) ---
        // Genera un hash SHA-256 para no guardar la contraseña en texto plano en localStorage
        const hashPassword = async (password) => {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        };

        // --- CONSTANTS & HELPERS ---
        const DATE_MIN = '2026-07-01';
        const DATE_MAX = '2026-12-31';

        // --- TEMAS DE COLOR (interfaz personalizable) ---
        const THEMES = {
            negro:   { name: 'Negro Clásico', primary: '#000000', primaryDark: '#1a1a1a', chart: ['#000000', '#525252', '#a3a3a3', '#2563eb', '#dc2626', '#16a34a', '#ca8a04'] },
            azul:    { name: 'Azul Profundo',  primary: '#1d4ed8', primaryDark: '#1e3a8a', chart: ['#1d4ed8', '#0891b2', '#7c3aed', '#0f172a', '#dc2626', '#16a34a', '#ca8a04'] },
            verde:   { name: 'Verde Bosque',   primary: '#15803d', primaryDark: '#14532d', chart: ['#15803d', '#0d9488', '#65a30d', '#1c1917', '#2563eb', '#dc2626', '#ca8a04'] },
            vino:    { name: 'Vino Tinto',     primary: '#9f1239', primaryDark: '#7f1d1d', chart: ['#9f1239', '#ea580c', '#a16207', '#1c1917', '#2563eb', '#15803d', '#7c3aed'] },
            grafito: { name: 'Grafito',        primary: '#334155', primaryDark: '#1e293b', chart: ['#334155', '#64748b', '#94a3b8', '#2563eb', '#dc2626', '#16a34a', '#ca8a04'] },
            dorado:  { name: 'Dorado',         primary: '#b45309', primaryDark: '#78350f', chart: ['#b45309', '#4d7c0f', '#0e7490', '#1c1917', '#dc2626', '#2563eb', '#7c3aed'] }
        };

        const applyTheme = (key) => {
            const theme = THEMES[key] || THEMES.negro;
            const root = document.documentElement;
            root.style.setProperty('--brand', theme.primary);
            root.style.setProperty('--brand-dark', theme.primaryDark);
            localStorage.setItem('matagalpa_theme', key);
        };

        const getThemeChartPalette = () => {
            const key = localStorage.getItem('matagalpa_theme') || 'negro';
            return (THEMES[key] || THEMES.negro).chart;
        };

        const formatCurrency = (val) => new Intl.NumberFormat('es-NI', { style: 'currency', currency: 'NIO' }).format(val);
        const formatNumber = (val) => new Intl.NumberFormat('es-NI', { maximumFractionDigits: 2 }).format(val);

        const calculateElasticity = (p0, p1, q0, q1) => {
            if (!p0 || !p1 || q0 === undefined || q1 === undefined || p0 == 0 || q0 == 0) 
                return { isValid: false, message: "Datos insuficientes o P0/Q0 es cero" };
            
            const p0_num = parseFloat(p0); const p1_num = parseFloat(p1);
            const q0_num = parseFloat(q0); const q1_num = parseFloat(q1);

            if (p0_num === p1_num) return { isValid: false, message: "No hay variación de precio" };

            const varP = ((p1_num - p0_num) / p0_num) * 100;
            const varQ = ((q1_num - q0_num) / q0_num) * 100;
            const E = varQ / varP;
            const E_abs = Math.abs(E);
            
            let clasificacion = "";
            if (Math.abs(E_abs - 1) < 0.02) clasificacion = "Unitaria";
            else if (E_abs > 1) clasificacion = "Elástica";
            else clasificacion = "Inelástica";

            return { isValid: true, varP, varQ, E, E_abs, clasificacion };
        };

        const generateMockData = () => {
            return {
                isMock: true,
                counters: { PROD: 3, PROV: 4, INT: 4, CON: 6 },
                products: [
                    { id: 'PROD-0001', name: 'Frijol Rojo', category: 'Granos Básicos', unit: 'Quintal', active: true, isMock: true },

                    { id: 'PROV-0002', name: 'Coop. San Isidro', productId: 'PROD-0001', price: 2800, date: '2026-08-20', obs: 'Escasez por lluvias', isMock: true },
                    { id: 'PROV-0003', name: 'Productor A. Pérez', productId: 'PROD-0002', price: 800, date: '2026-07-10', obs: '', isMock: true },
                    { id: 'PROV-0004', name: 'Hacienda El Progreso', productId: 'PROD-0003', price: 7500, date: '2026-09-05', obs: 'Buen rendimiento', isMock: true }
                ],
                intermediaries: [
                    { id: 'INT-0001', name: 'Mercado Sur Puesto 1', productId: 'PROD-0001', providerId: 'PROV-0001', acqPrice: 2500, salePrice: 3000, date: '2026-07-18', obs: '', isMock: true },
                    { id: 'INT-0002', name: 'Mercado Sur Puesto 1', productId: 'PROD-0001', providerId: 'PROV-0002', acqPrice: 2800, salePrice: 3400, date: '2026-08-25', obs: '', isMock: true },
                    { id: 'INT-0003', name: 'Distribuidora Matagalpa', productId: 'PROD-0002', providerId: 'PROV-0003', acqPrice: 800, salePrice: 1100, date: '2026-07-12', obs: '', isMock: true },

                ],
                consumers: [
                    { id: 'CON-0001', productId: 'PROD-0001', p0: 3000, p1: 3500, q0: 2, q1: 1, sensitivity: 'Alta', date: '2026-07-20', obs: 'Encuesta mercado', isMock: true, answers: { 'PQ-MOCK-1': 'No', 'PQ-MOCK-2': 'Sí', 'PQ-MOCK-3': 'Considero que el precio subió demasiado rápido.' }, ...calculateElasticity(3000, 3500, 2, 1) },
                    { id: 'CON-0002', productId: 'PROD-0001', p0: 3000, p1: 3200, q0: 2, q1: 1.5, sensitivity: 'Media', date: '2026-08-01', obs: '', isMock: true, answers: { 'PQ-MOCK-1': 'Tal vez', 'PQ-MOCK-2': 'Sí' }, ...calculateElasticity(3000, 3200, 2, 1.5) },
                    { id: 'CON-0003', productId: 'PROD-0002', p0: 1100, p1: 1500, q0: 5, q1: 4.5, sensitivity: 'Baja', date: '2026-07-25', obs: '', isMock: true, answers: { 'PQ-MOCK-1': 'Sí', 'PQ-MOCK-2': 'No' }, ...calculateElasticity(1100, 1500, 5, 4.5) },
                    { id: 'CON-0004', productId: 'PROD-0002', p0: 1100, p1: 1300, q0: 5, q1: 5, sensitivity: 'Nula', date: '2026-08-15', obs: 'Compra igual', isMock: true, answers: { 'PQ-MOCK-1': 'Sí', 'PQ-MOCK-2': 'No', 'PQ-MOCK-3': 'Buena relación calidad-precio.' }, ...calculateElasticity(1100, 1300, 5, 5) },
                    { id: 'CON-0005', productId: 'PROD-0003', p0: 8200, p1: 9000, q0: 10, q1: 5, sensitivity: 'Alta', date: '2026-09-15', obs: '', isMock: true, answers: { 'PQ-MOCK-1': 'No', 'PQ-MOCK-2': 'Sí' }, ...calculateElasticity(8200, 9000, 10, 5) },
                    { id: 'CON-0006', productId: 'PROD-0003', p0: 8200, p1: 8500, q0: 10, q1: 8, sensitivity: 'Media', date: '2026-09-20', obs: '', isMock: true, answers: { 'PQ-MOCK-1': 'Tal vez', 'PQ-MOCK-2': 'Tal vez', 'PQ-MOCK-3': 'El precio del café siempre varía, no me sorprende.' }, ...calculateElasticity(8200, 8500, 10, 8) }
                ],
                qualitativeQuestions: [
                    { id: 'PQ-MOCK-1', text: '¿Considera que el precio actual es justo?', type: 'choice' },
                    { id: 'PQ-MOCK-2', text: '¿Buscaría este producto en otro lugar si el precio sube?', type: 'choice' },
                    { id: 'PQ-MOCK-3', text: '¿Qué opina sobre la relación entre el precio y la calidad de este producto?', type: 'opinion' }
                ]
            };
        };

        const defaultProducts = [
            { id: 'PROD-0001', name: 'Frijol Rojo', category: 'Granos Básicos', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0002', name: 'Arroz 80/20', category: 'Granos Básicos', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0003', name: 'Maíz Blanco', category: 'Granos Básicos', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0004', name: 'Queso Seco', category: 'Lácteos', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0005', name: 'Tomate', category: 'Otros', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0006', name: 'Cebolla Amarilla', category: 'Otros', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0007', name: 'Chiltoma Nataly', category: 'Otros', unit: 'Docena', active: true, isMock: false },
            { id: 'PROD-0008', name: 'Papa', category: 'Otros', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0009', name: 'Huevo Blanco', category: 'Otros', unit: 'Cajilla', active: true, isMock: false },
            { id: 'PROD-0010', name: 'Aceite Vegetal', category: 'Otros', unit: 'Litro', active: true, isMock: false },
            { id: 'PROD-0011', name: 'Pollo Entero', category: 'Carnes', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0012', name: 'Posta de Res', category: 'Carnes', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0013', name: 'Posta de Cerdo', category: 'Carnes', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0014', name: 'Café Molido', category: 'Exportación', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0015', name: 'Azúcar Sulfitada', category: 'Granos Básicos', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0016', name: 'Repollo', category: 'Otros', unit: 'Unidad', active: true, isMock: false },
            { id: 'PROD-0017', name: 'Zanahoria', category: 'Otros', unit: 'Libra', active: true, isMock: false },
            { id: 'PROD-0018', name: 'Plátano Verde', category: 'Otros', unit: 'Unidad', active: true, isMock: false },
            { id: 'PROD-0019', name: 'Leche Fluida', category: 'Lácteos', unit: 'Litro', active: true, isMock: false },
            { id: 'PROD-0020', name: 'Pan Simple', category: 'Otros', unit: 'Bolsa', active: true, isMock: false }
        ];

        const initialEmptyState = { isMock: false, counters: { PROD: 20, PROV: 0, INT: 0, CON: 0 }, products: defaultProducts, providers: [], intermediaries: [], consumers: [], qualitativeQuestions: [] };

        // --- PREGUNTAS CUALITATIVAS (Encuesta a Consumidores) ---
        const CHOICE_OPTIONS = ['Sí', 'No', 'Tal vez'];
        const QUESTION_TYPES = { choice: 'Sí / No / Tal vez', opinion: 'Opinión (abierta)' };
        // Botones individuales para elegir el tipo de pregunta al crearla (Sí, No y Tal vez comparten el tipo 'choice')
        const QUESTION_TYPE_BUTTONS = [...CHOICE_OPTIONS.map(opt => ({ label: opt, type: 'choice' })), { label: QUESTION_TYPES.opinion, type: 'opinion' }];

        const Input = ({ label, type = "text", value, onChange, required, readOnly, min, max, step, placeholder, hint }) => (
            <div className="mb-4">
                <label className="block text-gray-900 text-sm font-bold mb-2">{label} {required && <span className="text-black">*</span>}</label>
                <input 
                    type={type} value={value} onChange={onChange} required={required} readOnly={readOnly}
                    min={min} max={max} step={step} placeholder={placeholder}
                    className={`shadow-sm appearance-none border border-gray-400 rounded w-full py-2 px-3 text-gray-900 leading-tight focus:outline-none focus:ring-2 focus:ring-black focus:border-black ${readOnly ? 'bg-gray-200 cursor-not-allowed' : 'bg-white'}`}
                />
                {hint && <p className="text-xs text-gray-600 mt-1">{hint}</p>}
            </div>
        );

        const Select = ({ label, value, onChange, options, required, readOnly }) => (
            <div className="mb-4">
                <label className="block text-gray-900 text-sm font-bold mb-2">{label} {required && <span className="text-black">*</span>}</label>
                <select 
                    value={value} onChange={onChange} required={required} disabled={readOnly}
                    className={`shadow-sm appearance-none border border-gray-400 rounded w-full py-2 px-3 text-gray-900 leading-tight focus:outline-none focus:ring-2 focus:ring-black focus:border-black ${readOnly ? 'bg-gray-200' : 'bg-white'}`}
                >
                    <option value="">Seleccione una opción</option>
                    {options.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                </select>
            </div>
        );

        const Button = ({ children, onClick, type = "button", variant = "primary", className = "", icon }) => {
            const baseStyle = "font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-150 ease-in-out flex items-center justify-center gap-2 border";
            const variants = {
                primary: "brand-bg brand-border",
                secondary: "bg-white hover:bg-gray-100 text-black border-gray-400",
                danger: "brand-bg brand-border",
                success: "bg-white hover:bg-gray-100 text-black border-black"
            };
            return (
                <button type={type} onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {icon && <i className={`fas fa-${icon}`}></i>}
                    {children}
                </button>
            );
        };

        const ThemePicker = ({ themeKey, onSelect, compact }) => (
            <div className={compact ? "flex flex-wrap gap-2" : "flex flex-wrap gap-3"}>
                {Object.entries(THEMES).map(([key, t]) => (
                    <button key={key} type="button" title={t.name} onClick={() => onSelect(key)}
                        className={`theme-swatch ${themeKey === key ? 'active' : ''}`}
                        style={{ backgroundColor: t.primary }}>
                    </button>
                ))}
            </div>
        );

        const Card = ({ title, value, subtitle, icon }) => (
            <div className="bg-white rounded-lg shadow-sm border border-gray-300 p-5">
                <div className="flex items-center">
                    <div className="flex-shrink-0">
                        <i className={`fas fa-${icon} fa-2x brand-text`}></i>
                    </div>
                    <div className="ml-5 w-0 flex-1">
                        <dl>
                            <dt className="text-sm font-bold text-gray-600 truncate uppercase tracking-wide">{title}</dt>
                            <dd className="text-2xl font-black text-black">{value}</dd>
                        </dl>
                    </div>
                </div>
                {subtitle && <div className="mt-2 text-sm text-gray-500 font-medium">{subtitle}</div>}
            </div>
        );

        const exportToExcel = (data) => {
            if (typeof XLSX === 'undefined') {
                alert("La librería de Excel no está disponible. Verifique su conexión a internet.");
                return;
            }

            const wb = XLSX.utils.book_new();

            const formatDataForExcel = (items) => {
                if (!items || items.length === 0) return [{ Mensaje: "No hay datos registrados en esta categoría" }];
                return items.map(item => {
                    const { isMock, ...rest } = item;
                    return rest;
                });
            };

            // Los consumidores incluyen un mapa "answers" (por ID de pregunta) que se aplana
            // a una columna legible por pregunta, usando el texto de la pregunta como encabezado.
            const formatConsumersForExcel = (items, questions) => {
                if (!items || items.length === 0) return [{ Mensaje: "No hay datos registrados en esta categoría" }];
                return items.map(item => {
                    const { isMock, answers, ...rest } = item;
                    const flatAnswers = {};
                    (questions || []).forEach(q => {
                        flatAnswers[`P: ${q.text}`] = (answers && answers[q.id] !== undefined) ? answers[q.id] : '';
                    });
                    return { ...rest, ...flatAnswers };
                });
            };

            const wsProducts = XLSX.utils.json_to_sheet(formatDataForExcel(data.products));
            XLSX.utils.book_append_sheet(wb, wsProducts, "Productos");

            const wsProviders = XLSX.utils.json_to_sheet(formatDataForExcel(data.providers));
            XLSX.utils.book_append_sheet(wb, wsProviders, "Proveedores");

            const wsIntermediaries = XLSX.utils.json_to_sheet(formatDataForExcel(data.intermediaries));
            XLSX.utils.book_append_sheet(wb, wsIntermediaries, "Intermediarios");

            const wsConsumers = XLSX.utils.json_to_sheet(formatConsumersForExcel(data.consumers, data.qualitativeQuestions));
            XLSX.utils.book_append_sheet(wb, wsConsumers, "Consumidores");

            if (data.qualitativeQuestions && data.qualitativeQuestions.length > 0) {
                const wsQuestions = XLSX.utils.json_to_sheet(data.qualitativeQuestions.map(q => ({ ID: q.id, Pregunta: q.text, Tipo: QUESTION_TYPES[q.type] || q.type })));
                XLSX.utils.book_append_sheet(wb, wsQuestions, "Preguntas Cualitativas");
            }

            XLSX.writeFile(wb, "Datos_Elasticidad_Matagalpa_2026.xlsx");
            
            alert("¡Archivo Excel generado con éxito!");
        };

        const AuthScreen = ({ onLogin, accountExists, onForgotPassword }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [accepted, setAccepted] = useState(false);
            const [error, setError] = useState('');

            const showPolicies = (e) => {
                e.preventDefault();
                alert("POLÍTICAS DE PRIVACIDAD - INVESTIGACIÓN MATAGALPA\n\n1. Los datos recopilados en esta aplicación son de uso exclusivo para la investigación académica.\n2. La información no será compartida con terceros sin consentimiento.\n3. Las credenciales se almacenan localmente en el dispositivo.\n\ndotmus.economic.");
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                
                if (!accepted) {
                    setError('Debe leer y aceptar las políticas para continuar.');
                    return;
                }
                
                const userTrimmed = username.trim();

                if (userTrimmed.length === 0) {
                    setError('El nombre de usuario no puede estar vacío.');
                    return;
                }

                if (password.length === 0) {
                    setError('La contraseña no puede estar vacía.');
                    return;
                }

                if (!accountExists) {
                    // MODO: Crear cuenta
                    if (password !== confirmPassword) {
                        setError('Las contraseñas no coinciden.');
                        return;
                    }
                    const hashedPass = await hashPassword(password);
                    onLogin(userTrimmed, hashedPass, true);
                } else {
                    // MODO: Iniciar sesión
                    const hashedPass = await hashPassword(password);
                    onLogin(userTrimmed, hashedPass, false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
                    <div className="max-w-md w-full space-y-8 bg-white p-8 rounded-none shadow-md border border-black">
                        <div>
                            <h2 className="mt-2 text-center text-3xl font-black text-black uppercase tracking-tight">
                                {accountExists ? 'Acceso al Sistema' : 'Crear Cuenta de Investigador'}
                            </h2>
                            <p className="mt-2 text-center text-sm font-bold text-gray-500 uppercase tracking-widest">
                                Elasticidad Matagalpa 2026
                            </p>
                            {!accountExists && (
                                <div className="mt-4 bg-gray-100 border border-black p-3 text-sm text-black font-medium text-center">
                                    Este dispositivo no tiene una cuenta configurada. Cree sus credenciales para uso local.
                                </div>
                            )}
                        </div>
                        <form className="mt-8 space-y-6" onSubmit={handleSubmit}>
                            {error && (
                                <div className="bg-white border-l-4 border-black p-4 text-sm text-black font-bold flex items-center shadow-sm">
                                    <i className="fas fa-exclamation-triangle mr-2"></i> {error}
                                </div>
                            )}
                            <div className="-space-y-px">
                                <div>
                                    <label className="sr-only">Usuario</label>
                                    <input type="text" required value={username} onChange={e=>setUsername(e.target.value)} 
                                        className="appearance-none relative block w-full px-3 py-3 border border-black placeholder-gray-500 text-black focus:outline-none focus:ring-2 focus:ring-black focus:border-black sm:text-sm bg-white" 
                                        placeholder="Usuario" 
                                    />
                                </div>
                                <div className="mt-4">
                                    <label className="sr-only">Contraseña</label>
                                    <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} 
                                        className="appearance-none relative block w-full px-3 py-3 border border-black placeholder-gray-500 text-black focus:outline-none focus:ring-2 focus:ring-black focus:border-black sm:text-sm bg-white" 
                                        placeholder="Contraseña" 
                                    />
                                </div>
                                {!accountExists && (
                                    <div className="mt-4">
                                        <label className="sr-only">Confirmar Contraseña</label>
                                        <input type="password" required value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} 
                                            className="appearance-none relative block w-full px-3 py-3 border border-black placeholder-gray-500 text-black focus:outline-none focus:ring-2 focus:ring-black focus:border-black sm:text-sm bg-white" 
                                            placeholder="Confirmar Contraseña" 
                                        />
                                    </div>
                                )}
                            </div>

                            <div className="flex items-center justify-between">
                                <div className="flex items-start">
                                    <div className="flex items-center h-5">
                                        <input id="policies" type="checkbox" required checked={accepted} onChange={e=>setAccepted(e.target.checked)} 
                                            className="h-4 w-4 text-black focus:ring-black border-black cursor-pointer bg-white" 
                                        />
                                    </div>
                                    <div className="ml-2 text-sm">
                                        <label htmlFor="policies" className="text-black font-medium cursor-pointer">
                                            Acepto las <button onClick={showPolicies} className="text-black hover:text-gray-600 underline font-bold">Políticas de Privacidad</button>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <button type="submit" className="group relative w-full flex justify-center py-3 px-4 border brand-border text-sm font-bold text-white brand-bg focus:outline-none focus:ring-2 focus:ring-offset-2 transition-colors uppercase tracking-wider">
                                    {accountExists ? 'Iniciar Sesión' : 'Crear Cuenta y Entrar'}
                                </button>
                            </div>
                            {accountExists && (
                                <div className="text-center">
                                    <button type="button" onClick={onForgotPassword} className="text-sm font-bold text-gray-600 hover:text-black underline">
                                        ¿Olvidó su contraseña?
                                    </button>
                                </div>
                            )}
                        </form>
                        
                        <div className="mt-8 border-t border-gray-300 pt-6 flex flex-col items-center">
                            <p className="text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-3">Diseñado y Verificado por</p>
                            <div className="flex items-center gap-3 bg-white px-4 py-2 border border-black">
                                <div className="w-8 h-8 brand-bg flex items-center justify-center">
                                    <span className="text-white font-bold text-xs">de</span>
                                </div>
                                <span className="font-black text-black tracking-tight text-lg">dotmus.economic</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SettingsScreen = ({ currentUsername, onUpdateCredentials, onResetAccount, themeKey, onThemeChange }) => {
            const [newUsername, setNewUsername] = useState(currentUsername);
            const [currentPassword, setCurrentPassword] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [confirmNewPassword, setConfirmNewPassword] = useState('');
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');

            const handleUpdate = async (e) => {
                e.preventDefault();
                setError(''); setSuccess('');
                
                if(!currentPassword) { setError('Debe ingresar su contraseña actual para realizar cambios.'); return; }

                if (newPassword && newPassword !== confirmNewPassword) {
                    setError('Las nuevas contraseñas no coinciden.'); return;
                }

                const currentHash = await hashPassword(currentPassword);
                const newHash = newPassword ? await hashPassword(newPassword) : null;
                
                onUpdateCredentials(newUsername, currentHash, newHash, (result) => {
                    if(result.success) {
                        setSuccess(result.message);
                        setCurrentPassword(''); setNewPassword(''); setConfirmNewPassword('');
                    } else {
                        setError(result.message);
                    }
                });
            };

            return (
                <div className="max-w-3xl mx-auto space-y-6">
                    <h2 className="text-2xl font-bold text-black border-b border-black pb-2 uppercase tracking-wide">Configuración de Seguridad</h2>

                    <div className="bg-white p-6 shadow-sm border border-black">
                        <h3 className="text-lg font-bold mb-1 text-black uppercase">Apariencia</h3>
                        <p className="text-sm text-gray-600 mb-4 font-medium">Elija el color de acento de la interfaz y de las gráficas del dashboard.</p>
                        <ThemePicker themeKey={themeKey} onSelect={onThemeChange} />
                        <p className="mt-3 text-xs font-bold uppercase tracking-wide brand-text">{THEMES[themeKey]?.name}</p>
                    </div>

                    <form onSubmit={handleUpdate} className="bg-white p-6 shadow-sm border border-black">
                        <h3 className="text-lg font-bold mb-4 text-black uppercase">Cambiar Credenciales</h3>
                        
                        {error && <div className="mb-4 bg-gray-100 border-l-4 border-black p-3 text-sm text-black font-bold">{error}</div>}
                        {success && <div className="mb-4 bg-white border border-black p-3 text-sm text-black font-bold flex items-center"><i className="fas fa-check mr-2"></i>{success}</div>}

                        <Input label="Nombre de Usuario" value={newUsername} onChange={e=>setNewUsername(e.target.value)} required />
                        
                        <div className="mt-6 mb-4 border-t border-gray-200 pt-4">
                            <h4 className="text-sm font-bold text-gray-600 uppercase mb-2">Cambiar Contraseña (Opcional)</h4>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <Input type="password" label="Nueva Contraseña" value={newPassword} onChange={e=>setNewPassword(e.target.value)} />
                                <Input type="password" label="Confirmar Nueva Contraseña" value={confirmNewPassword} onChange={e=>setConfirmNewPassword(e.target.value)} />
                            </div>
                        </div>

                        <div className="bg-gray-100 p-4 border border-black mb-4">
                            <Input type="password" label="Contraseña Actual (Requerida para guardar cambios)" value={currentPassword} onChange={e=>setCurrentPassword(e.target.value)} required />
                        </div>

                        <Button type="submit" icon="save" className="w-full sm:w-auto">Guardar Cambios</Button>
                    </form>

                    <div className="bg-white p-6 shadow-sm border border-black mt-8">
                        <h3 className="text-lg font-bold mb-2 text-black uppercase">Restablecimiento Total</h3>
                        <p className="text-sm text-gray-600 mb-4 font-medium">Esta acción eliminará la cuenta actual y TODOS los datos de investigación almacenados en este dispositivo. Esta acción no se puede deshacer.</p>
                        <Button variant="danger" icon="exclamation-triangle" onClick={onResetAccount}>
                            Restablecer cuenta y datos
                        </Button>
                    </div>
                </div>
            );
        };

        const downloadCanvasChart = (chartInstance, filename) => {
            if (!chartInstance) return;
            const link = document.createElement('a');
            link.href = chartInstance.toBase64Image('image/png', 1);
            link.download = filename;
            link.click();
        };

        const Dashboard = ({ data, globalFilters, themeKey }) => {
            const chart1Ref = useRef(null); const chart2Ref = useRef(null);
            const chart3Ref = useRef(null); const chart4Ref = useRef(null);
            const chart5Ref = useRef(null);
            const chartInstances = useRef({});
            const qualChartRefs = useRef({});
            const qualChartInstances = useRef({});
            const dashboardRef = useRef(null);
            const [isExporting, setIsExporting] = useState(false);

            const downloadDashboardImage = () => {
                if (!dashboardRef.current || typeof html2canvas === 'undefined') {
                    alert("No se pudo generar la imagen. Verifique su conexión a internet.");
                    return;
                }
                setIsExporting(true);
                html2canvas(dashboardRef.current, { backgroundColor: '#f3f4f6', scale: 2, useCORS: true }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Dashboard_Elasticidad_Matagalpa_${new Date().toISOString().split('T')[0]}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    setIsExporting(false);
                }).catch(() => {
                    alert("Ocurrió un error al generar la imagen del dashboard.");
                    setIsExporting(false);
                });
            };

            const filteredProducts = useMemo(() => data.products.filter(p => !globalFilters.product || p.id === globalFilters.product), [data.products, globalFilters.product]);
            const productIds = useMemo(() => filteredProducts.map(p => p.id), [filteredProducts]);
            
            const filteredProviders = useMemo(() => data.providers.filter(p => productIds.includes(p.productId)), [data.providers, productIds]);
            const filteredIntermediaries = useMemo(() => data.intermediaries.filter(i => productIds.includes(i.productId)), [data.intermediaries, productIds]);
            const filteredConsumers = useMemo(() => data.consumers.filter(c => productIds.includes(c.productId) && c.isValid), [data.consumers, productIds]);
            // A diferencia de filteredConsumers (que exige c.isValid para los cálculos de elasticidad),
            // las respuestas cualitativas son válidas aunque no haya variación de precio registrada.
            const filteredConsumersAll = useMemo(() => data.consumers.filter(c => productIds.includes(c.productId)), [data.consumers, productIds]);
            const qualitativeChoiceQuestions = useMemo(() => (data.qualitativeQuestions || []).filter(q => q.type === 'choice'), [data.qualitativeQuestions]);
            const qualitativeOpinionQuestions = useMemo(() => (data.qualitativeQuestions || []).filter(q => q.type === 'opinion'), [data.qualitativeQuestions]);

            // Se promedia el VALOR ABSOLUTO de cada coeficiente (no el promedio de valores con signo,
            // que puede anularse entre casos elásticos positivos y negativos y subestimar la elasticidad real).
            const avgElasticity = filteredConsumers.length > 0 ? filteredConsumers.reduce((acc, curr) => acc + curr.E_abs, 0) / filteredConsumers.length : 0;
            const countElastic = filteredConsumers.filter(c => c.clasificacion === 'Elástica').length;
            const countInelastic = filteredConsumers.filter(c => c.clasificacion === 'Inelástica').length;
            const countUnitary = filteredConsumers.filter(c => c.clasificacion === 'Unitaria').length;
            const allPrices = [...filteredProviders.map(p=>p.price), ...filteredIntermediaries.map(i=>i.salePrice)];
            const avgPrice = allPrices.length > 0 ? allPrices.reduce((a,b)=>a+b,0)/allPrices.length : 0;

            useEffect(() => {
                Object.values(chartInstances.current).forEach(chart => chart.destroy());
                chartInstances.current = {};
                Object.values(qualChartInstances.current).forEach(chart => chart.destroy());
                qualChartInstances.current = {};

                const commonOptions = {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, padding: 14, font: { size: 11, family: 'Inter' } } } }
                };
                const themePalette = (THEMES[themeKey] || THEMES.negro).chart;
                const chartColors = themePalette;

                if (chart1Ref.current) {
                    const labels = filteredProducts.map(p => p.name);
                    const provData = labels.map(name => {
                        const pid = filteredProducts.find(p => p.name === name).id;
                        const prices = filteredProviders.filter(p => p.productId === pid).map(p => p.price);
                        return prices.length ? prices.reduce((a,b)=>a+b,0)/prices.length : 0;
                    });
                    const intData = labels.map(name => {
                        const pid = filteredProducts.find(p => p.name === name).id;
                        const prices = filteredIntermediaries.filter(i => i.productId === pid).map(i => i.salePrice);
                        return prices.length ? prices.reduce((a,b)=>a+b,0)/prices.length : 0;
                    });

                    chartInstances.current.c1 = new Chart(chart1Ref.current, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [
                                { label: 'Promedio Proveedor', data: provData, backgroundColor: chartColors[2] },
                                { label: 'Promedio Intermediario', data: intData, backgroundColor: chartColors[0] }
                            ]
                        },
                        options: { ...commonOptions, plugins: { ...commonOptions.plugins, title: { display: true, text: 'PRECIOS POR PRODUCTO', font: {family: 'Inter', weight: 'bold'} } } }
                    });
                }

                if (chart2Ref.current) {
                    // Un dataset por producto (y color distinto) para no mezclar precios de escalas muy diferentes
                    // (ej. café ~C$8000 vs frijol ~C$3000) en una sola línea, lo cual distorsiona la lectura de la tendencia.
                    const palette = themePalette;
                    const byProduct = filteredProducts.map(prod => ({
                        prod,
                        points: [
                            ...filteredProviders.filter(p => p.productId === prod.id).map(p => ({date: p.date, price: p.price})),
                            ...filteredIntermediaries.filter(i => i.productId === prod.id).map(i => ({date: i.date, price: i.salePrice}))
                        ]
                    }));
                    const allDates = [...new Set(byProduct.flatMap(bp => bp.points.map(pt => pt.date)))].sort((a,b) => new Date(a) - new Date(b));
                    const datasets = byProduct.map((bp, idx) => ({
                        label: bp.prod.name,
                        data: allDates.map(d => {
                            const match = bp.points.find(pt => pt.date === d);
                            return match ? match.price : null;
                        }),
                        borderColor: palette[idx % palette.length], backgroundColor: palette[idx % palette.length],
                        spanGaps: true, tension: 0.1, fill: false
                    }));

                    chartInstances.current.c2 = new Chart(chart2Ref.current, {
                        type: 'line',
                        data: { labels: allDates, datasets },
                        options: { ...commonOptions, scales: { y: { title: { display: true, text: 'Precio (NIO)' } } }, plugins: { ...commonOptions.plugins, title: { display: true, text: 'EVOLUCIÓN TEMPORAL POR PRODUCTO', font: {family: 'Inter', weight: 'bold'} } } }
                    });
                }

                if (chart3Ref.current) {
                    // Un dataset por producto: mezclar precios de productos con escalas muy distintas en una sola nube
                    // de puntos hace ilegible la relación precio-cantidad de cada producto.
                    const palette = themePalette;
                    const scatterDatasets = filteredProducts.map((prod, idx) => ({
                        label: prod.name,
                        data: filteredConsumers.filter(c => c.productId === prod.id).flatMap(c => [{ x: c.p0, y: c.q0 }, { x: c.p1, y: c.q1 }]),
                        backgroundColor: palette[idx % palette.length]
                    }));
                    chartInstances.current.c3 = new Chart(chart3Ref.current, {
                        type: 'scatter',
                        data: { datasets: scatterDatasets },
                        options: { ...commonOptions, scales: { x: { title: {display:true, text:'Precio (NIO)'}}, y: {title: {display:true, text:'Cantidad'}} }, plugins: { ...commonOptions.plugins, title: { display: true, text: 'DISPERSIÓN DEMANDA POR PRODUCTO', font: {family: 'Inter', weight: 'bold'} } } }
                    });
                }

                if (chart4Ref.current) {
                    chartInstances.current.c4 = new Chart(chart4Ref.current, {
                        type: 'doughnut',
                        data: {
                            labels: ['Elástica (>1)', 'Unitaria (=1)', 'Inelástica (<1)'],
                            datasets: [{ data: [countElastic, countUnitary, countInelastic], backgroundColor: chartColors }]
                        },
                        options: { ...commonOptions, plugins: { ...commonOptions.plugins, title: { display: true, text: 'DISTRIBUCIÓN ELASTICIDAD', font: {family: 'Inter', weight: 'bold'} } } }
                    });
                }

                if (chart5Ref.current) {
                    const labels = filteredProducts.map(p => p.name);
                    const eData = labels.map(name => {
                        const pid = filteredProducts.find(p => p.name === name).id;
                        const cons = filteredConsumers.filter(c => c.productId === pid);
                        return cons.length ? cons.reduce((a,b)=>a+Math.abs(b.E),0)/cons.length : 0;
                    });
                    chartInstances.current.c5 = new Chart(chart5Ref.current, {
                        type: 'bar',
                        data: { labels, datasets: [{ label: '|E| Promedio', data: eData, backgroundColor: chartColors[0] }] },
                        options: { ...commonOptions, plugins: { ...commonOptions.plugins, title: { display: true, text: 'ELASTICIDAD PROMEDIO POR PRODUCTO', font: {family: 'Inter', weight: 'bold'} } } }
                    });
                }

                // Un gráfico de barras por cada pregunta cerrada (Sí/No/Tal vez), contando
                // cuántos consumidores encuestados respondieron cada opción.
                qualitativeChoiceQuestions.forEach(q => {
                    const canvasEl = qualChartRefs.current[q.id];
                    if (!canvasEl) return;
                    const counts = CHOICE_OPTIONS.map(opt => filteredConsumersAll.filter(c => c.answers && c.answers[q.id] === opt).length);
                    qualChartInstances.current[q.id] = new Chart(canvasEl, {
                        type: 'bar',
                        data: { labels: CHOICE_OPTIONS, datasets: [{ label: 'Respuestas', data: counts, backgroundColor: chartColors.slice(0, 3) }] },
                        options: { ...commonOptions, plugins: { ...commonOptions.plugins, legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
                    });
                });

            }, [filteredProducts, filteredProviders, filteredIntermediaries, filteredConsumers, filteredConsumersAll, qualitativeChoiceQuestions, themeKey]);

            const chartDownloadBtn = (key, filename) => (
                <button onClick={() => downloadCanvasChart(chartInstances.current[key], filename)} title="Descargar este gráfico como imagen" className="absolute top-2 right-2 z-10 bg-white border border-black text-black text-xs w-7 h-7 rounded-full flex items-center justify-center hover:bg-black hover:text-white transition-colors shadow-sm">
                    <i className="fas fa-download"></i>
                </button>
            );

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-black pb-2">
                        <h2 className="text-2xl font-bold text-black uppercase tracking-wide">Dashboard Analítico</h2>
                        <Button onClick={downloadDashboardImage} icon={isExporting ? "spinner fa-spin" : "image"} className="text-sm px-3 py-2 font-bold w-full sm:w-auto">
                            {isExporting ? 'Generando...' : 'Descargar Dashboard (Imagen)'}
                        </Button>
                    </div>

                    <div ref={dashboardRef} className="space-y-6 bg-gray-100 p-1">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <Card title="Consumidores Encuestados" value={filteredConsumers.length} icon="users" />
                            <Card title="Elasticidad Promedio |E|" value={formatNumber(avgElasticity)} icon="chart-line" subtitle="Promedio de valores absolutos" />
                            <Card title="Precio Promedio General" value={formatCurrency(avgPrice)} icon="tag" />
                            <Card title="Casos Inelásticos" value={countInelastic} icon="anchor" subtitle={`De ${filteredConsumers.length} totales`} />
                        </div>

                        {!globalFilters.product && filteredProducts.length > 1 && (
                            <div className="bg-gray-100 border border-black p-3 text-xs font-bold text-gray-700 flex items-center gap-2">
                                <i className="fas fa-info-circle"></i> Está viendo todos los productos a la vez: los gráficos de evolución y dispersión separan cada producto por color para que precios de distinta escala (ej. café vs. frijol) no se mezclen. Para un análisis más preciso, filtre por un solo producto.
                            </div>
                        )}

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="relative bg-white p-4 shadow-sm border border-gray-300">{chartDownloadBtn('c1','precios_por_producto.png')}<div className="relative w-full h-80"><canvas ref={chart1Ref}></canvas></div></div>
                            <div className="relative bg-white p-4 shadow-sm border border-gray-300">{chartDownloadBtn('c2','evolucion_temporal.png')}<div className="relative w-full h-80"><canvas ref={chart2Ref}></canvas></div></div>
                            <div className="relative bg-white p-4 shadow-sm border border-gray-300">{chartDownloadBtn('c3','dispersion_demanda.png')}<div className="relative w-full h-80"><canvas ref={chart3Ref}></canvas></div></div>
                            <div className="relative bg-white p-4 shadow-sm border border-gray-300">{chartDownloadBtn('c4','distribucion_elasticidad.png')}<div className="relative w-full h-80"><canvas ref={chart4Ref}></canvas></div></div>
                            <div className="relative bg-white p-4 shadow-sm border border-gray-300 lg:col-span-2">{chartDownloadBtn('c5','elasticidad_promedio_producto.png')}<div className="relative w-full h-80"><canvas ref={chart5Ref}></canvas></div></div>
                        </div>

                        {(qualitativeChoiceQuestions.length > 0 || qualitativeOpinionQuestions.length > 0) && (
                            <div className="space-y-4">
                                <h3 className="text-lg font-bold text-black uppercase tracking-wide border-b border-black pb-2">Resultados Cualitativos</h3>
                                {qualitativeChoiceQuestions.length > 0 && (
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        {qualitativeChoiceQuestions.map(q => (
                                            <div key={q.id} className="relative bg-white p-4 shadow-sm border border-gray-300">
                                                <p className="text-xs font-bold text-gray-700 uppercase mb-2">{q.text}</p>
                                                <div className="relative w-full h-64">
                                                    <canvas ref={el => { if (el) qualChartRefs.current[q.id] = el; }}></canvas>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {qualitativeOpinionQuestions.length > 0 && (
                                    <div className="grid grid-cols-1 gap-4">
                                        {qualitativeOpinionQuestions.map(q => {
                                            const opinions = filteredConsumersAll.filter(c => c.answers && c.answers[q.id]);
                                            return (
                                                <div key={q.id} className="bg-white p-4 shadow-sm border border-gray-300">
                                                    <p className="text-xs font-bold text-gray-700 uppercase mb-2">{q.text}</p>
                                                    {opinions.length === 0 ? (
                                                        <p className="text-sm text-gray-400 italic">Aún no hay opiniones registradas.</p>
                                                    ) : (
                                                        <ul className="max-h-48 overflow-y-auto space-y-1 text-sm text-gray-800 divide-y divide-gray-100">
                                                            {opinions.map((c, idx) => <li key={idx} className="py-1">"{c.answers[q.id]}"</li>)}
                                                        </ul>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const DataTable = ({ title, data, columns, onDelete }) => {
            const [searchTerm, setSearchTerm] = useState("");
            const filteredData = data.filter(item => Object.values(item).some(val => String(val).toLowerCase().includes(searchTerm.toLowerCase())));

            return (
                <div className="bg-white shadow-sm border border-black overflow-hidden">
                    <div className="p-4 border-b border-black flex flex-col sm:flex-row justify-between items-center gap-4 bg-gray-50">
                        <h3 className="text-lg font-bold text-black uppercase">{title}</h3>
                        <div className="flex gap-2 w-full sm:w-auto">
                            <input type="text" placeholder="Buscar..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="shadow-sm border border-black py-2 px-3 text-sm focus:ring-black w-full sm:w-64" />
                        </div>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="min-w-full divide-y divide-gray-300">
                            <thead className="bg-black">
                                <tr>
                                    {columns.map((col, idx) => <th key={idx} className="px-6 py-3 text-left text-xs font-bold text-white uppercase tracking-wider">{col.header}</th>)}
                                    <th className="px-6 py-3 text-right text-xs font-bold text-white uppercase tracking-wider">Acciones</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                                {filteredData.length === 0 ? (
                                    <tr><td colSpan={columns.length + 1} className="px-6 py-4 text-center text-sm font-bold text-gray-500 uppercase">No hay registros.</td></tr>
                                ) : (
                                    filteredData.map((row, i) => (
                                        <tr key={i} className="hover:bg-gray-50 transition-colors">
                                            {columns.map((col, j) => <td key={j} className="px-6 py-4 whitespace-nowrap text-sm font-medium text-black">{col.render ? col.render(row) : row[col.accessor]}</td>)}
                                            <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                <button onClick={() => onDelete(row.id)} className="text-black hover:text-gray-600 ml-3 border border-black px-2 py-1 bg-gray-100" title="Eliminar"><i className="fas fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const FormProduct = ({ onSave, onCancel }) => {
            const [formData, setFormData] = useState({ name: '', category: '', unit: '', description: '', active: true });
            const handleSubmit = (e) => { e.preventDefault(); onSave(formData); };
            return (

        const FormConsumer = ({ onSave, onCancel, products, onSaveAndContinue, qualitativeQuestions }) => {

                    <Select label="Producto Evaluado" value={formData.productId} onChange={e=>setFormData({...formData, productId: e.target.value})} options={products.map(p=>({label: p.name, value: p.id}))} required />
                    
                    <div className="grid grid-cols-2 gap-3 mb-2">

                        <Input type="date" label="Fecha" value={formData.date} onChange={e=>setFormData({...formData, date: e.target.value})} required min={DATE_MIN} max={DATE_MAX} />

                    {qualitativeQuestions && qualitativeQuestions.length > 0 && (

        const App = () => {
            // Auth States
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [accountExists, setAccountExists] = useState(false);
            const [currentUser, setCurrentUser] = useState('');
            
            // App States
            const [data, setData] = useState(initialEmptyState);
            const [view, setView] = useState('dashboard');
            const [formMode, setFormMode] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [globalFilters, setGlobalFilters] = useState({ product: '', type: '' });
            const [themeKey, setThemeKey] = useState(() => localStorage.getItem('matagalpa_theme') || 'negro');

            useEffect(() => { applyTheme(themeKey); }, [themeKey]);

            useEffect(() => {
                // Verificar persistencia de cuenta y sesión
                const storedAccount = localStorage.getItem('matagalpa_account');
                const authStatus = localStorage.getItem('matagalpa_auth');
                
                if (storedAccount) {
                    setAccountExists(true);
                    const accountInfo = JSON.parse(storedAccount);
                    if (authStatus === 'true') {
                        setIsAuthenticated(true);
                        setCurrentUser(accountInfo.username);
                    }
                }

                // Cargar datos de investigación
                const savedData = localStorage.getItem('matagalpa_research_data');
                if (savedData) {
                    try { 
                        let parsedData = JSON.parse(savedData);
                        if (!parsedData.counters) parsedData.counters = { PROD: 20, PROV: 0, INT: 0, CON: 0 };
                        if (!parsedData.providers) parsedData.providers = [];
                        if (!parsedData.intermediaries) parsedData.intermediaries = [];
                        if (!parsedData.consumers) parsedData.consumers = [];
                        if (!parsedData.qualitativeQuestions) parsedData.qualitativeQuestions = [];
                        if (!parsedData.products || parsedData.products.length === 0) {
                            parsedData.products = defaultProducts;
                            parsedData.counters.PROD = Math.max(parsedData.counters.PROD || 0, 20);
                        }
                        setData(parsedData); 
                    } catch(e) { console.error("Error loading data"); }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('matagalpa_research_data', JSON.stringify(data));
            }, [data]);

            // Manejador de Login / Registro delegando la validación del hash
            const handleAuth = (username, passwordHash, isRegistering) => {
                if (isRegistering) {
                    const newAccount = { username, passwordHash };
                    localStorage.setItem('matagalpa_account', JSON.stringify(newAccount));
                    localStorage.setItem('matagalpa_auth', 'true');
                    setAccountExists(true);
                    setIsAuthenticated(true);
                    setCurrentUser(username);
                } else {
                    const storedAccount = JSON.parse(localStorage.getItem('matagalpa_account'));
                    if (storedAccount.username === username && storedAccount.passwordHash === passwordHash) {
                        localStorage.setItem('matagalpa_auth', 'true');
                        setIsAuthenticated(true);
                        setCurrentUser(username);
                    } else {
                        alert("Error: Las credenciales no coinciden con la cuenta almacenada en este dispositivo.");
                    }
                }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                localStorage.removeItem('matagalpa_auth'); // No elimina la cuenta ni los datos, solo la sesión activa
                setView('dashboard');
            };

            // Elimina SOLO la cuenta (usuario/contraseña) para permitir crear una nueva.
            // Los datos de investigación (productos, proveedores, intermediarios, encuestas) NO se tocan.
            const handleForgotPassword = () => {
                if (confirm("Se eliminará el usuario y la contraseña de este dispositivo para que pueda crear unos nuevos.\n\nSus datos de investigación (productos, proveedores, intermediarios y encuestas) NO se borrarán.\n\n¿Desea continuar?")) {
                    localStorage.removeItem('matagalpa_account');
                    localStorage.removeItem('matagalpa_auth');
                    setAccountExists(false);
                    setIsAuthenticated(false);
                    setCurrentUser('');
                }
            };

            const handleUpdateCredentials = (newUsername, currentHash, newHash, callback) => {
                const storedAccount = JSON.parse(localStorage.getItem('matagalpa_account'));
                
                if (storedAccount.passwordHash !== currentHash) {
                    callback({ success: false, message: 'La contraseña actual es incorrecta.' });
                    return;
                }

                storedAccount.username = newUsername;
                if (newHash) storedAccount.passwordHash = newHash;
                
                localStorage.setItem('matagalpa_account', JSON.stringify(storedAccount));
                setCurrentUser(newUsername);
                callback({ success: true, message: 'Credenciales actualizadas correctamente.' });
            };

            const handleResetAccount = () => {
                if(confirm("ADVERTENCIA: Esta acción eliminará la cuenta y TODOS los datos almacenados en este dispositivo de forma permanente.\n\n¿Desea continuar?")) {
                    localStorage.removeItem('matagalpa_account');
                    localStorage.removeItem('matagalpa_auth');
                    localStorage.removeItem('matagalpa_research_data');
                    
                    setAccountExists(false);
                    setIsAuthenticated(false);
                    setCurrentUser('');
                    setData(initialEmptyState);
                    setView('dashboard');
                }
            };

            const generateID = (prefix) => {
                const currentCount = data.counters[prefix] + 1;
                const newId = `${prefix}-${String(currentCount).padStart(4, '0')}`;
                return { newId, newCount: currentCount };
            };

            const handleSave = (module, itemData) => {
                const prefixMap = { products: 'PROD', providers: 'PROV', intermediaries: 'INT', consumers: 'CON' };
                const prefix = prefixMap[module];
                const { newId, newCount } = generateID(prefix);
                const newItem = { ...itemData, id: newId, isMock: false };
                
                setData(prev => ({
                    ...prev, [module]: [...prev[module], newItem], counters: { ...prev.counters, [prefix]: newCount }
                }));
                setFormMode(false);
            };

            const handleSaveAndContinue = (module, itemData) => {
                const prefix = 'CON';
                const { newId, newCount } = generateID(prefix);
                const newItem = { ...itemData, id: newId, isMock: false };
                setData(prev => ({
                    ...prev, [module]: [...prev[module], newItem], counters: { ...prev.counters, [prefix]: newCount }
                }));
                alert(`Guardado: ${newId}`);
            };

            const handleDelete = (module, id) => {
                if(confirm(`¿Eliminar registro ${id}?`)) setData(prev => ({ ...prev, [module]: prev[module].filter(item => item.id !== id) }));
            };

            const handleAddQuestion = (q) => {
                const newQuestion = { ...q, id: `PQ-${Date.now()}` };
                setData(prev => ({ ...prev, qualitativeQuestions: [...(prev.qualitativeQuestions || []), newQuestion] }));
            };

            const handleDeleteQuestion = (id) => {
                if(confirm("¿Eliminar esta pregunta del banco?\n\nLas respuestas que ya se guardaron seguirán almacenadas en cada registro de consumidor, pero la pregunta ya no aparecerá en el formulario, en el detalle de respuestas ni en la exportación a Excel.")) {
                    setData(prev => ({ ...prev, qualitativeQuestions: (prev.qualitativeQuestions || []).filter(q => q.id !== id) }));
                }
            };

            const navItems = [
                { id: 'dashboard', icon: 'chart-pie', label: 'Dashboard' },
                { id: 'products', icon: 'box', label: 'Productos' },
                { id: 'providers', icon: 'truck', label: 'Proveedores' },
                { id: 'intermediaries', icon: 'store', label: 'Intermediarios' },
                { id: 'consumers', icon: 'users', label: 'Consumidores' },
                { id: 'settings', icon: 'cog', label: 'Configuración' }
            ];

            if (!isAuthenticated) {
                return <AuthScreen onLogin={handleAuth} accountExists={accountExists} onForgotPassword={handleForgotPassword} />;
            }

            return (
                <div className="flex h-screen overflow-hidden bg-gray-200 font-sans">
                    <aside className={`fixed inset-y-0 left-0 brand-sidebar text-white w-64 transform transition-transform duration-300 ease-in-out z-30 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 flex flex-col border-r border-gray-800`}>
                        <div className="p-4 border-b border-gray-800 flex justify-between items-center">
                            <h1 className="text-lg font-black leading-tight uppercase tracking-widest">Elasticidad<br/><span className="text-sm font-bold text-gray-500">Matagalpa '26</span></h1>
                            <button className="md:hidden text-gray-400 hover:text-white" onClick={() => setIsMobileMenuOpen(false)}><i className="fas fa-times"></i></button>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto hide-scrollbar">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => { setView(item.id); setFormMode(false); setIsMobileMenuOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 text-left font-bold transition-colors border ${view === item.id ? 'brand-bg brand-border' : 'bg-transparent text-gray-400 border-transparent hover:border-gray-700 hover:text-white'}`}>
                                    <i className={`fas fa-${item.icon} w-5 text-center`}></i> {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gray-800 space-y-2">
                            <div className="mb-4 bg-gray-900 p-3 border border-gray-800">
                                <p className="text-[10px] text-gray-500 font-bold mb-1 uppercase tracking-widest">Color de la Interfaz</p>
                                <ThemePicker themeKey={themeKey} onSelect={setThemeKey} compact />
                            </div>
                            <div className="mb-4 bg-gray-900 p-3 border border-gray-800">
                                <p className="text-[10px] text-gray-500 font-bold mb-1 uppercase tracking-widest">Cuenta Activa (Local)</p>
                                <p className="text-white text-sm font-bold truncate flex items-center gap-2"><i className="fas fa-user-circle"></i> {currentUser}</p>
                            </div>
                            <Button variant="secondary" onClick={() => {
                                const hasRealData = !data.isMock && (data.providers.length || data.intermediaries.length || data.consumers.length || (data.qualitativeQuestions && data.qualitativeQuestions.length));
                                const msg = hasRealData
                                    ? "ADVERTENCIA: Ya tiene datos reales registrados. Cargar datos de prueba los REEMPLAZARÁ por completo (se perderán). ¿Desea continuar?"
                                    : "¿Cargar datos de prueba?";
                                if(confirm(msg)) setData(generateMockData());
                            }} className="w-full text-xs font-bold" icon="database">Datos Prueba</Button>
                            <Button variant="danger" onClick={handleLogout} className="w-full text-xs font-bold bg-gray-900 text-white hover:bg-white hover:text-black hover:border-white transition-colors border border-gray-700" icon="sign-out-alt">Cerrar Sesión</Button>
                        </div>
                    </aside>

                    <div className="flex-1 flex flex-col overflow-hidden relative">
                        <header className="bg-white shadow-sm z-20 border-b-2 brand-border">
                            <div className="flex items-center justify-between p-4">
                                <button className="md:hidden text-black focus:outline-none" onClick={() => setIsMobileMenuOpen(true)}>
                                    <i className="fas fa-bars text-xl"></i>
                                </button>
                                <h2 className="text-xl font-black text-black uppercase tracking-wide hidden sm:block">
                                    {navItems.find(i=>i.id===view)?.label} {formMode && '> Nuevo Registro'}
                                </h2>
                                
                                <div className="flex gap-2">
                                    {view === 'dashboard' && (
                                        <select value={globalFilters.product} onChange={e=>setGlobalFilters({...globalFilters, product: e.target.value})} className="border border-black py-1 px-2 text-sm bg-gray-100 font-bold focus:outline-none">
                                            <option value="">Filtro: Todos</option>
                                            {data.products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                        </select>
                                    )}
                                    <Button variant="success" onClick={() => exportToExcel(data)} icon="file-excel" className="text-sm px-3 py-1 font-bold">Exportar Excel</Button>
                                    {!formMode && !['dashboard', 'settings'].includes(view) && (
                                        <Button onClick={() => setFormMode(true)} icon="plus" className="text-sm px-3 py-1 font-bold">Nuevo</Button>
                                    )}
                                </div>
                            </div>
                            {data.isMock && <div className="bg-black text-white text-center text-[10px] py-1 font-black tracking-widest uppercase border-b border-white">Modo: Datos de Prueba Activos</div>}
                        </header>

                        <main className="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-4 md:p-6 pb-24 md:pb-6">
                            
                            {view === 'dashboard' && !formMode && <Dashboard data={data} globalFilters={globalFilters} themeKey={themeKey} />}
                            {view === 'settings' && !formMode && <SettingsScreen currentUsername={currentUser} onUpdateCredentials={handleUpdateCredentials} onResetAccount={handleResetAccount} themeKey={themeKey} onThemeChange={setThemeKey} />}
                            
                            {view === 'products' && !formMode && <DataTable title="Catálogo de Productos" data={data.products} onDelete={(id) => handleDelete('products', id)} columns={[{ header: 'ID', accessor: 'id' }, { header: 'Nombre', accessor: 'name' }, { header: 'Categoría', accessor: 'category' }, { header: 'Unidad', accessor: 'unit' }]} />}
                            {view === 'products' && formMode && <FormProduct onSave={(d) => handleSave('products', d)} onCancel={() => setFormMode(false)} />}

                            {view === 'providers' && !formMode && <DataTable title="Precios Proveedores" data={data.providers} onDelete={(id) => handleDelete('providers', id)} columns={[{ header: 'ID', accessor: 'id' }, { header: 'Proveedor', accessor: 'name' }, { header: 'Producto', render: (r) => data.products.find(p=>p.id===r.productId)?.name }, { header: 'Precio', render: (r) => formatCurrency(r.price) }, { header: 'Fecha', accessor: 'date' }, { header: 'Obs.', accessor: 'obs' }]} />}
                            {view === 'providers' && formMode && <FormProvider products={data.products} history={data.providers} onSave={(d) => handleSave('providers', d)} onCancel={() => setFormMode(false)} />}

                            {view === 'intermediaries' && !formMode && <DataTable title="Precios Intermediarios" data={data.intermediaries} onDelete={(id) => handleDelete('intermediaries', id)} columns={[{ header: 'ID', accessor: 'id' }, { header: 'Intermediario', accessor: 'name' }, { header: 'Producto', render: (r) => data.products.find(p=>p.id===r.productId)?.name }, { header: 'P. Adq.', render: (r) => formatCurrency(r.acqPrice) }, { header: 'P. Venta', render: (r) => formatCurrency(r.salePrice) }, { header: 'Obs.', accessor: 'obs' }]} />}
                            {view === 'intermediaries' && formMode && <FormIntermediary products={data.products} providers={data.providers} onSave={(d) => handleSave('intermediaries', d)} onCancel={() => setFormMode(false)} />}

                            {view === 'consumers' && !formMode && (
                                <div className="space-y-4">
                                    <QuestionManager questions={data.qualitativeQuestions || []} onAdd={handleAddQuestion} onDelete={handleDeleteQuestion} />
                                    <DataTable title="Encuestas Consumidores" data={data.consumers} onDelete={(id) => handleDelete('consumers', id)} columns={[{ header: 'ID', accessor: 'id' }, { header: 'Entrevistado', render: (r) => r.intervieweeName || <span className="text-gray-400 text-xs">N/A</span> }, { header: 'Fecha', accessor: 'date' }, { header: 'Producto', render: (r) => data.products.find(p=>p.id===r.productId)?.name }, { header: 'P0->P1', render: (r) => `${r.p0}->${r.p1}` }, { header: 'Q0->Q1', render: (r) => `${r.q0}->${r.q1}` }, { header: '|E|', render: (r) => <span className="font-bold text-black">{r.isValid ? r.E_abs.toFixed(3) : 'N/A'}</span> }, { header: 'Cualitativas', render: (r) => {
                                        const qs = data.qualitativeQuestions || [];
                                        if (qs.length === 0) return <span className="text-gray-400 text-xs">N/A</span>;
                                        const answered = qs.filter(q => r.answers && r.answers[q.id] !== undefined && r.answers[q.id] !== '').length;
                                        return (
                                            <details className="text-xs">
                                                <summary className="list-none [&::-webkit-details-marker]:hidden inline-flex items-center gap-1 cursor-pointer select-none text-xs font-bold border border-black px-2 py-1 bg-gray-100 hover:bg-black hover:text-white transition-colors">
                                                    <i className="fas fa-comment-dots"></i>Ver ({answered}/{qs.length})
                                                </summary>
                                                <div className="mt-2 space-y-2 text-left bg-gray-50 border border-gray-300 p-3 whitespace-normal max-w-xs">
                                                    {qs.map(q => (
                                                        <div key={q.id}>
                                                            <p className="font-bold text-gray-900">{q.text}</p>
                                                            <p className="text-gray-700">{(r.answers && r.answers[q.id]) ? r.answers[q.id] : '(sin respuesta)'}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </details>
                                        );
                                    } }]} />
                                </div>
                            )}
                            {view === 'consumers' && formMode && <FormConsumer products={data.products} qualitativeQuestions={data.qualitativeQuestions || []} onSave={(d) => handleSave('consumers', d)} onSaveAndContinue={(d) => handleSaveAndContinue('consumers', d)} onCancel={() => setFormMode(false)} />}

                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
